name = "ekalliptus"
account_id = "f24eb3f70bf59379632e280f8756b9e4"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets model (NOT Pages). Deploy via `wrangler deploy`.
# The @astrojs/cloudflare adapter writes .wrangler/deploy/config.json (a
# redirect to dist/server/wrangler.json) at build time so a root
# `wrangler deploy` picks up main=entry.mjs + the assets binding automatically.

# KV namespace backing Astro's session API (adapter auto-binds "SESSION").
[[kv_namespaces]]
binding = "SESSION"
id = "fa54633d534d4662a0365aaffe577c75"

# Distributed coarse rate limit for public API writes (60 req/min/IP, counted
# per Cloudflare location). Fine-grained per-endpoint buckets live in
# src/lib/public-api.ts; when this binding is absent the in-memory limits
# still apply.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
